

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Beautiful Diary</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --paper: #fffaf0;
    --text: #3f3428;
    --accent: #8b5e3c;
    --border: #d8c3a5;
}

body {
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--text);

    background:
        linear-gradient(rgba(55, 35, 20, .25), rgba(55, 35, 20, .25)),
        url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2000&q=80");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    transition: .4s;
}

/* Dark mode */

body.dark {
    --paper: #202020;
    --text: #eeeeee;
    --accent: #d6a86b;
    --border: #555;

    background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
        url("https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2000&q=80");

    background-size: cover;
    background-position: center;
}

/* Header */

header {
    width: 100%;
    padding: 18px 30px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    background: rgba(20, 15, 10, .55);
    backdrop-filter: blur(10px);

    color: white;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

.header-buttons {
    display: flex;
    gap: 8px;
}

.header-buttons button {
    border: none;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;

    background: rgba(255,255,255,.18);
    color: white;
    font-size: 15px;
}

.header-buttons button:hover {
    background: rgba(255,255,255,.3);
}

/* Main */

.container {
    width: 95%;
    max-width: 1250px;
    margin: 30px auto;

    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 25px;
}

/* Sidebar */

.sidebar {
    background: rgba(255, 250, 240, .92);
    border-radius: 20px;
    padding: 20px;

    box-shadow: 0 15px 40px rgba(0,0,0,.25);

    backdrop-filter: blur(10px);
}

body.dark .sidebar {
    background: rgba(30,30,30,.92);
}

.sidebar h2 {
    margin-bottom: 15px;
}

.new-entry {
    width: 100%;
    padding: 12px;

    border: none;
    border-radius: 10px;

    background: var(--accent);
    color: white;

    font-size: 16px;
    cursor: pointer;
}

.new-entry:hover {
    opacity: .85;
}

.search {
    width: 100%;
    margin: 15px 0;

    padding: 11px;

    border: 1px solid var(--border);
    border-radius: 10px;

    background: transparent;
    color: var(--text);
}

.entries {
    max-height: 480px;
    overflow-y: auto;
}

.entry-item {
    padding: 12px;
    margin-bottom: 8px;

    border-radius: 10px;

    cursor: pointer;

    border: 1px solid transparent;
}

.entry-item:hover {
    background: rgba(139,94,60,.1);
}

.entry-item.active {
    background: rgba(139,94,60,.18);
    border-color: var(--border);
}

.entry-date {
    font-size: 12px;
    opacity: .7;
}

.entry-title {
    margin-top: 4px;
    font-weight: bold;
}

/* Diary */

.diary {
    background: var(--paper);

    min-height: 650px;

    border-radius: 8px 22px 22px 8px;

    padding: 40px 50px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.35),
        inset 8px 0 0 rgba(0,0,0,.05);

    position: relative;
}

/* Paper lines */

.diary::before {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            transparent,
            transparent 31px,
            rgba(120,100,80,.12) 32px
        );

    border-radius: inherit;
}

.diary-content {
    position: relative;
    z-index: 1;
}

.date {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.date input,
.mood select {
    padding: 9px;

    border: 1px solid var(--border);
    border-radius: 8px;

    background: transparent;
    color: var(--text);
}

.title {
    width: 100%;

    margin-top: 25px;
    margin-bottom: 15px;

    border: none;
    outline: none;

    background: transparent;

    font-size: 32px;
    font-family: Georgia, serif;

    color: var(--text);
}

.title::placeholder {
    color: var(--text);
    opacity: .45;
}

.content {
    width: 100%;
    min-height: 390px;

    resize: vertical;

    border: none;
    outline: none;

    background: transparent;

    color: var(--text);

    font-size: 19px;
    line-height: 32px;

    font-family: Georgia, serif;
}

.content::placeholder {
    color: var(--text);
    opacity: .45;
}

/* Bottom */

.bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-top: 20px;

    gap: 10px;
    flex-wrap: wrap;
}

.status {
    opacity: .65;
    font-size: 13px;
}

.actions {
    display: flex;
    gap: 8px;
}

.actions button {
    border: none;

    padding: 10px 14px;

    border-radius: 9px;

    cursor: pointer;

    background: #eee0ca;
    color: #4a3726;
}

.actions button:hover {
    transform: translateY(-1px);
}

.delete {
    background: #b94a48 !important;
    color: white !important;
}

/* Responsive */

@media(max-width: 800px) {

    .container {
        grid-template-columns: 1fr;
    }

    .sidebar {
        order: 2;
    }

    .diary {
        padding: 25px;
    }

    .title {
        font-size: 26px;
    }

    .content {
        min-height: 350px;
    }

    header {
        padding: 15px;
    }

    .logo {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        📖 My Beautiful Diary
    </div>

    <div class="header-buttons">

        <button onclick="toggleDarkMode()">
            🌙
        </button>

        <button onclick="changeBackground()">
            🌄 Background
        </button>

        <button onclick="customBackground()">
            🖼️ Custom
        </button>

    </div>

</header>


<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>📚 My Pages</h2>

        <button class="new-entry" onclick="newEntry()">
            + New Entry
        </button>

        <input
            class="search"
            id="search"
            placeholder="🔍 Search diary..."
            oninput="renderEntries()"
        >

        <div class="entries" id="entries"></div>

    </aside>


    <!-- Diary -->

    <main class="diary">

        <div class="diary-content">

            <div class="date">

                <input
                    type="date"
                    id="date"
                    onchange="saveEntry()"
                >

                <div class="mood">

                    <select id="mood" onchange="saveEntry()">

                        <option value="😊">😊 Happy</option>
                        <option value="😌">😌 Calm</option>
                        <option value="😍">😍 Excited</option>
                        <option value="😢">😢 Sad</option>
                        <option value="😡">😡 Angry</option>
                        <option value="😴">😴 Tired</option>
                        <option value="🤔">🤔 Thinking</option>

                    </select>

                </div>

            </div>


            <input
                class="title"
                id="title"
                placeholder="Dear Diary..."
                oninput="saveEntry()"
            >


            <textarea
                class="content"
                id="content"
                placeholder="Write your thoughts here...

Today I feel...
Today I learned...
Something I want to remember..."
                oninput="saveEntry()"
            ></textarea>


            <div class="bottom">

                <div class="status" id="status">
                    Ready
                </div>

                <div class="actions">

                    <button onclick="favoriteEntry()">
                        ⭐ Favorite
                    </button>

                    <button onclick="exportEntry()">
                        📤 Export
                    </button>

                    <button class="delete" onclick="deleteEntry()">
                        🗑️ Delete
                    </button>

                </div>

            </div>

        </div>

    </main>

</div>


<input
    type="file"
    id="backgroundInput"
    accept="image/*"
    style="display:none"
>


<script>

let entries =
    JSON.parse(localStorage.getItem("myDiary")) || [];

let currentId = null;

const dateInput =
    document.getElementById("date");

const titleInput =
    document.getElementById("title");

const contentInput =
    document.getElementById("content");

const moodInput =
    document.getElementById("mood");

const status =
    document.getElementById("status");

const search =
    document.getElementById("search");


// Generate ID

function generateId() {
    return Date.now().toString();
}


// New Entry

function newEntry() {

    const today =
        new Date().toISOString().split("T")[0];

    const entry = {

        id: generateId(),

        date: today,

        title: "",

        content: "",

        mood: "😊",

        favorite: false

    };

    entries.unshift(entry);

    currentId = entry.id;

    saveAll();

    loadEntry(entry);

    renderEntries();

    titleInput.focus();
}


// Save current entry

function saveEntry() {

    if (!currentId) return;

    const entry =
        entries.find(e => e.id === currentId);

    if (!entry) return;

    entry.date =
        dateInput.value;

    entry.title =
        titleInput.value;

    entry.content =
        contentInput.value;

    entry.mood =
        moodInput.value;

    saveAll();

    renderEntries();

    status.textContent =
        "✓ Saved";

    setTimeout(() => {
        status.textContent = "Auto-saved";
    }, 1000);
}


// Save all

function saveAll() {

    localStorage.setItem(
        "myDiary",
        JSON.stringify(entries)
    );
}


// Load entry

function loadEntry(entry) {

    currentId = entry.id;

    dateInput.value =
        entry.date;

    titleInput.value =
        entry.title;

    contentInput.value =
        entry.content;

    moodInput.value =
        entry.mood || "😊";

    status.textContent =
        "Opened";
}


// Render entries

function renderEntries() {

    const box =
        document.getElementById("entries");

    const query =
        search.value.toLowerCase();

    box.innerHTML = "";

    const filtered =
        entries.filter(entry =>

            entry.title.toLowerCase()
                .includes(query)

            ||

            entry.content.toLowerCase()
                .includes(query)

            ||

            entry.date.includes(query)

        );

    filtered.forEach(entry => {

        const div =
            document.createElement("div");

        div.className =
            "entry-item";

        if (entry.id === currentId) {
            div.classList.add("active");
        }

        div.innerHTML = `

            <div class="entry-date">
                ${entry.date}
            </div>

            <div class="entry-title">
                ${entry.mood || "😊"}
                ${entry.favorite ? "⭐" : ""}
                ${escapeHTML(entry.title || "Untitled")}
            </div>
        `;

        div.onclick = () => {

            loadEntry(entry);

            renderEntries();

        };

        box.appendChild(div);

    });
}


// Delete

function deleteEntry() {

    if (!currentId) return;

    const yes =
        confirm("Delete this diary entry?");

    if (!yes) return;

    entries =
        entries.filter(
            e => e.id !== currentId
        );

    currentId = null;

    saveAll();

    clearEditor();

    renderEntries();
}


// Clear editor

function clearEditor() {

    dateInput.value = "";

    titleInput.value = "";

    contentInput.value = "";

    moodInput.value = "😊";

    status.textContent =
        "New diary page";
}


// Favorite

function favoriteEntry() {

    if (!currentId) return;

    const entry =
        entries.find(e => e.id === currentId);

    if (!entry) return;

    entry.favorite =
        !entry.favorite;

    saveAll();

    renderEntries();
}


// Export

function exportEntry() {

    if (!currentId) return;

    const entry =
        entries.find(e => e.id === currentId);

    if (!entry) return;

    const text =

`MY BEAUTIFUL DIARY

Date: ${entry.date}
Mood: ${entry.mood}

${entry.title}

${entry.content}
`;

    const blob =
        new Blob([text], {
            type: "text/plain"
        });

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        `${entry.date || "diary"}.txt`;

    a.click();

    URL.revokeObjectURL(url);
}


// Dark Mode

function toggleDarkMode() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "darkMode",
        document.body.classList.contains("dark")
    );
}


// Background

const backgrounds = [

    "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2000&q=80",

    "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2000&q=80",

    "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=2000&q=80",

    "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=80"

];

let backgroundIndex =
    Number(localStorage.getItem("backgroundIndex")) || 0;


function setBackground(url) {

    document.body.style.backgroundImage =

        `linear-gradient(rgba(55,35,20,.25),rgba(55,35,20,.25)),url("${url}")`;

    localStorage.setItem(
        "backgroundURL",
        url
    );
}


function changeBackground() {

    backgroundIndex++;

    if (
        backgroundIndex >= backgrounds.length
    ) {
        backgroundIndex = 0;
    }

    setBackground(
        backgrounds[backgroundIndex]
    );

    localStorage.setItem(
        "backgroundIndex",
        backgroundIndex
    );
}


// Custom background

function customBackground() {

    document
        .getElementById("backgroundInput")
        .click();

}


document
    .getElementById("backgroundInput")
    .addEventListener("change", function() {

        const file =
            this.files[0];

        if (!file) return;

        const reader =
            new FileReader();

        reader.onload = function(e) {

            setBackground(
                e.target.result
            );

        };

        reader.readAsDataURL(file);

    });


// Security helper

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}


// Load saved settings

if (
    localStorage.getItem("darkMode") === "true"
) {

    document.body.classList.add("dark");

}


const savedBackground =
    localStorage.getItem("backgroundURL");

if (savedBackground) {

    setBackground(savedBackground);

}


// Start

if (entries.length > 0) {

    loadEntry(entries[0]);

} else {

    newEntry();

}

renderEntries();

</script>

</body>
</html>
